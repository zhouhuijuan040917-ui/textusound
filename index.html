<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.xethub.hf.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102c49" />
    <meta
      name="description"
      content="A personal TOEFL learning workspace: reading, listening, writing, speaking, vocabulary and review. Local browser storage and private Kokoro speech generation."
    />
    <title>TOEFL Learning Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23102c49'/%3E%3Ctext x='8' y='24' font-size='24' font-family='serif' fill='%237bd9d0'%3ET%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="app"><p class="loading">正在打开学习资料库…</p></div>
    <dialog id="editor" aria-label="Material and vocabulary editor"></dialog>
    <div
      id="notice"
      class="toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <section
      id="generation-panel"
      class="generation-panel"
      aria-label="Speech generation progress"
      hidden
    >
      <div>
        <strong id="generation-message" role="status"
          >Loading speech engine…</strong
        ><button id="cancel-generation" type="button">Cancel</button>
      </div>
      <progress id="generation-progress" max="100" value="0"></progress>
    </section>
    <div id="quick-player" class="quick-player"></div>
    <input
      id="upload-audio"
      type="file"
      accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac,.webm"
      hidden
    />
    <script type="module" src="./src/studio.js"></script>
  </body>
</html>
